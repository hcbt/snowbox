[package]
name = "snowbox"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Host Daemon for Snowbox"

[[bin]]
name = "snowbox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
dirs = "6"
hex = "0.4"
rand = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
