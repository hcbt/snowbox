# Shell, formatters, git hooks. Guest image and vfkit runner live in flake.nix
# (they need nixosSystem + aarch64-linux, which devenv's rolling channel is not).
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
